<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER OF X - Enterprise AI OS</title>
  <style>
    :root {
      --bg-color: #0A0A12;
      --panel-bg: rgba(16, 18, 30, 0.85);
      --border-color: #54D3F5;
      --text-main: #FFFFFF;
      --text-muted: #8892B0;
      --accent: #54D3F5;
      --gold: #FFD82E;
      --error: #FF6B6B;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-color);
      color: var(--text-main);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-image: 
        linear-gradient(to right, rgba(84, 211, 245, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(84, 211, 245, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
    }
    .dashboard {
      width: 90%;
      max-width: 1000px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(84, 211, 245, 0.2);
      padding: 40px;
      backdrop-filter: blur(10px);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--text-muted);
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    .title {
      font-size: 24px;
      font-weight: bold;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0;
    }
    .status {
      color: #10B981;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10B981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; box-shadow: 0 0 10px #10B981; }
      50% { opacity: 0.5; box-shadow: 0 0 2px #10B981; }
      100% { opacity: 1; box-shadow: 0 0 10px #10B981; }
    }
    .terminal {
      background: #050505;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 20px;
      height: 400px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.6;
    }
    .cmd-line { margin-bottom: 15px; }
    .cmd-prompt { color: var(--accent); }
    .agent-marketing { color: #A78BFA; }
    .agent-finance { color: #34D399; }
    .agent-orchestrator { color: var(--gold); }
    .action-button {
      background: rgba(84, 211, 245, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 12px 24px;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s ease;
      margin-top: 30px;
      display: inline-block;
      text-decoration: none;
    }
    .action-button:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 15px var(--accent);
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="header">
      <h1 class="title">Enterprise AI Board of Directors</h1>
      <div class="status">
        <div class="status-dot"></div>
        SYSTEM ONLINE
      </div>
    </div>

    <p style="color: var(--text-muted); margin-bottom: 20px;">
      Welcome to the AI-Native Enterprise OS. The autonomous Marketing and Finance agents manage campaigns below. 
      You are the Human in the Loop. Large budget approvals require your override.
    </p>

    <div class="terminal" id="terminal">
      <div class="cmd-line" style="color: var(--text-muted);">
        Type an objective and click RUN to deploy the agents.
      </div>
    </div>
    
    <div style="display: flex; gap: 10px; margin-top: 20px;">
      <input type="text" id="objective-input" placeholder="e.g. Aggressive market takeover requiring massive ad spend" 
        style="flex: 1; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid #333; color: white; border-radius: 4px;">
      <button class="action-button" id="btn-run" style="margin-top: 0;">DEPLOY AGENTS</button>
    </div>

  </div>

  <script>
    const terminal = document.getElementById('terminal');
    const runBtn = document.getElementById('btn-run');
    const objInput = document.getElementById('objective-input');
    
    let currentApprovalId = null;

    function appendLine(html) {
      const div = document.createElement('div');
      div.className = 'cmd-line';
      div.innerHTML = html;
      terminal.appendChild(div);
      terminal.scrollTop = terminal.scrollHeight;
    }

    runBtn.addEventListener('click', async () => {
      const objective = objInput.value || "Increase Q3 social media engagement by 15%";
      terminal.innerHTML = '';
      
      appendLine(`<span class="cmd-prompt">C:\\CYBER_OF_X></span> Deploying agents for: "${objective}"`);
      appendLine(`<span class="agent-marketing">[Marketing Agent]</span> Formulating campaign proposal...`);
      
      runBtn.disabled = true;
      try {
        const response = await fetch('http://localhost:5000/api/run', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ objective })
        });
        const data = await response.json();
        
        appendLine(`<span class="agent-marketing">[Notion Log]</span> Proposed campaign '${data.marketing.campaign_name}' requesting $${data.marketing.budget}`);
        appendLine(`<span class="agent-finance">[Finance Agent]</span> Reviewing budget against policy...`);
        
        if (data.status === 'auto_approved') {
          appendLine(`<span class="agent-finance">[Notion Log]</span> Auto-approved budget for '${data.marketing.campaign_name}'.`);
          appendLine(`<span class="agent-orchestrator" style="color:#10B981; font-weight:bold;">[SUCCESS]</span> Budget automatically secured. Marketing can proceed.`);
          runBtn.disabled = false;
        } else if (data.status === 'pending_human') {
          appendLine(`<span class="agent-finance">[Notion Log]</span> Escalated budget request to Human. Exceeds $30k limit.`);
          appendLine(`<span class="agent-orchestrator">[Orchestrator]</span> Escalation required. Requesting Human Approval...`);
          
          appendLine(`
            <div id="human-panel" style="margin-top: 15px; border: 1px dashed var(--gold); padding: 15px; border-radius: 4px;">
              <div style="color: var(--gold); font-weight: bold; margin-bottom: 10px;">*** HUMAN APPROVAL NEEDED ***</div>
              <div>Campaign: ${data.marketing.campaign_name} | Budget Requested: $${data.marketing.budget}</div>
              <div style="margin-top: 10px;">
                <button onclick="submitDecision('Approved')" style="background: #10B981; border: none; padding: 8px 16px; color: black; font-weight: bold; cursor: pointer; border-radius: 3px;">APPROVE</button>
                <button onclick="submitDecision('Denied')" style="background: #FF6B6B; border: none; padding: 8px 16px; color: black; font-weight: bold; cursor: pointer; border-radius: 3px; margin-left: 10px;">DENY</button>
              </div>
            </div>
          `);
          currentApprovalId = data.approval_id;
        }
      } catch (err) {
        appendLine(`<span style="color:red">Error: Could not connect to API. Make sure 'python app.py' is running on port 5000.</span>`);
        runBtn.disabled = false;
      }
    });

    window.submitDecision = async (decision) => {
      document.getElementById('human-panel').style.opacity = '0.5';
      
      try {
        await fetch('http://localhost:5000/api/approve', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ approval_id: currentApprovalId, decision })
        });
        
        appendLine(`<span class="agent-orchestrator">[Human Board of Directors]</span> Decision received: ${decision}`);
        
        if (decision === 'Approved') {
          appendLine(`<span class="agent-orchestrator" style="color:#10B981; font-weight:bold;">[SUCCESS]</span> Workflow Complete: Budget secured. Marketing can proceed.`);
        } else {
          appendLine(`<span class="agent-orchestrator" style="color:#FF6B6B; font-weight:bold;">[DENIED]</span> Workflow Complete: Budget denied. Marketing must revise.`);
        }
      } catch (err) {
        appendLine(`<span style="color:red">Error submitting decision.</span>`);
      }
      runBtn.disabled = false;
    };
  </script>
</body>
</html>
